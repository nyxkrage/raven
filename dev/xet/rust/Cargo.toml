[package]
name = "xet-ocaml-ffi"
version = "0.1.0"
edition = "2024"
license = "ISC"
publish = false

[lib]
name = "xet_ocaml_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1"
xet-pkg = { package = "hf-xet", path = "../../../vendor/xet-core/xet_pkg" }
xet-runtime = { path = "../../../vendor/xet-core/xet_runtime" }

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
